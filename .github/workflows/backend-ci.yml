name: Backend Build, Lint, and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
      - name: Check formatting
        working-directory: ./backend
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install GStreamer headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-workspaces: ./backend
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./backend
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Lint with clippy
        working-directory: ./backend
        run: cargo clippy -- -D warnings
        env:
          DATABASE_URL: postgres://surcast:surcast@localhost:5433/surcast
          JWT_SECRET: ci-lint-secret

  test-lib:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: surcast
          POSTGRES_PASSWORD: surcast
          POSTGRES_DB: surcast
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U surcast"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install GStreamer (headers + plugins for analysis/gstreamer unit tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-workspaces: ./backend
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./backend
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@nextest
      - name: Run lib tests
        working-directory: ./backend
        run: cargo nextest run --lib --profile ci
        env:
          DATABASE_URL: postgres://surcast:surcast@localhost:5433/surcast
          JWT_SECRET: ci-test-secret
          GST_PLUGIN_SYSTEM_PATH_1_0: /usr/lib/x86_64-linux-gnu/gstreamer-1.0

  test-gstreamer:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: surcast
          POSTGRES_PASSWORD: surcast
          POSTGRES_DB: surcast
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U surcast"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-workspaces: ./backend
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./backend
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@nextest
      - name: Run GStreamer pipeline tests
        working-directory: ./backend
        run: cargo nextest run --lib --profile ci --run-ignored ignored-only
        env:
          DATABASE_URL: postgres://surcast:surcast@localhost:5433/surcast
          JWT_SECRET: ci-test-secret
          GST_PLUGIN_SYSTEM_PATH_1_0: /usr/lib/x86_64-linux-gnu/gstreamer-1.0

  test-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: surcast
          POSTGRES_PASSWORD: surcast
          POSTGRES_DB: surcast
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U surcast"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install GStreamer and Icecast (for e2e)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            icecast2 \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-workspaces: ./backend
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./backend
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@nextest
      - name: Run integration tests
        working-directory: ./backend
        # e2e tests start/kill real Icecast (kill_zombie_icecast kills ANY
        # icecast via /proc), so any parallel e2e kills each other -> SIGKILL.
        # Keep serial like before (cargo test --tests -- --test-threads=1).
        run: cargo nextest run --tests --profile ci --test-threads 1
        env:
          DATABASE_URL: postgres://surcast:surcast@localhost:5433/surcast
          JWT_SECRET: ci-test-secret
          GST_PLUGIN_SYSTEM_PATH_1_0: /usr/lib/x86_64-linux-gnu/gstreamer-1.0

  build-release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install GStreamer deps (for build)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-workspaces: ./backend
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./backend
          save-if: true
      - name: Build release
        working-directory: ./backend
        run: cargo build --release
        env:
          DATABASE_URL: postgres://surcast:surcast@localhost:5433/surcast
          JWT_SECRET: ci-build-secret
