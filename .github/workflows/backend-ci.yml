name: Backend Build, Lint, and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: surcast
          POSTGRES_PASSWORD: surcast
          POSTGRES_DB: surcast
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U surcast"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install GStreamer and Icecast
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            icecast2 \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # The action has no `working-directory` input; point its built-in
          # rust-cache at the backend workspace so `cargo metadata` runs there
          # instead of failing in the repository root.
          cache-workspaces: ./backend

      - uses: actions/cache@v6
        with:
          path: backend/target
          key: cargo-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Check formatting
        working-directory: ./backend
        run: cargo fmt --all -- --check

      - name: Lint with clippy
        working-directory: ./backend
        run: cargo clippy -- -D warnings
        env:
          DATABASE_URL: postgres://surcast:surcast@localhost:5433/surcast
          JWT_SECRET: ci-lint-secret

      - name: Run unit tests
        working-directory: ./backend
        run: cargo test --lib
        env:
          DATABASE_URL: postgres://surcast:surcast@localhost:5433/surcast
          JWT_SECRET: ci-test-secret

      - name: Run integration tests
        working-directory: ./backend
        run: cargo test --tests -- --test-threads=1
        env:
          DATABASE_URL: postgres://surcast:surcast@localhost:5433/surcast
          JWT_SECRET: ci-test-secret

      - name: Build release
        working-directory: ./backend
        run: cargo build --release
        env:
          DATABASE_URL: postgres://surcast:surcast@localhost:5433/surcast
          JWT_SECRET: ci-build-secret
