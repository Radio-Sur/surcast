services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: surcast
      POSTGRES_PASSWORD: surcast
      POSTGRES_DB: surcast
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surcast"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://surcast:surcast@postgres:5432/surcast
    ports:
      - "80:3001"
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
