[package]
name = "surcast-backend"
version = "0.0.1"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["macros", "multipart", "ws"] }
futures = "0.3"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }
jsonwebtoken = "9"
bcrypt = "0.16"
tower-http = { version = "0.5", features = ["cors", "trace", "fs", "catch-panic"] }
tower = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dotenvy = "0.15"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", features = ["json"] }
id3 = "1"
zip = "2"
tokio-stream = "0.1"
base64 = "0.23"
async-trait = "0.1"
quick-xml = "0.37"
autocue-rs = { path = "../autocue-rs" }

[dev-dependencies]
axum-test = "16"
tempfile = "3"
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
serial_test = "3"
